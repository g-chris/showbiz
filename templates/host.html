<!DOCTYPE html>
<html>
<head>
    <title>Hollywood Game - Host</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>🎬 Hollywood Moguls - Host View</h1>
    <p style="color: #888; font-size: 14px; margin: 5px 0;">Version 0.2.3</p>

    <div style="text-align: center; margin: 20px 0; background: #2a2a2a; padding: 20px; border-radius: 10px;">
        <h3 style="margin-top: 0;">📱 Players Scan to Join</h3>
        <img src="/qr-code" alt="Join Game QR Code" style="border: 3px solid #333; padding: 10px; background: white; border-radius: 5px;">
        <p id="player-url" style="font-size: 16px; color: #4CAF50; margin-top: 10px; font-weight: bold;"></p>
    </div>
    
    <div class="phase-info">
        <h2>Phase: <span id="phase">Lobby</span></h2>
        <div id="phase-details"></div>
    </div>
    
    <div id="players"></div>
    
    <div id="controls">
        <button onclick="startPhase0()" id="start-btn">Start Game (Phase 0)</button>
    </div>
    
    <div id="content"></div>
    
    <script src="{{ url_for('static', filename='js/host.js') }}"></script>
</body>
</html>
